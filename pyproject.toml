[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "your-package"
version = "0.1.0"
description = "Analysis tools for linking RNA and ATAC pseudobulk data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anndata",
  "matplotlib",
  "numpy",
  "pandas",
  "seaborn",
  "statsmodels",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
